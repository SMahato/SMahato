title: SMahato Consulting
tagline: Battery & Energy Programme Delivery
description: >-
  Independent energy consultant. Tesla-proven battery programme management,
  manufacturing quality, fleet analytics. Direct access. No overhead. Bengaluru.
url: "https://smahato.com"
author: Sumit Mahato
lang: en

permalink: /blog/:title/
markdown: kramdown

# Controlled topic taxonomy for the blog filter (slug + display label)
blog_topics:
  - slug: energy-system-design
    label: Energy system design
  - slug: manufacturing
    label: Manufacturing
  - slug: fleet-analytics
    label: Fleet analytics
  - slug: energy-policy
    label: Energy policy
  - slug: energy-market
    label: Energy market
    
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Default social-share card, used when a page sets no image of its own
image: /assets/img/solar_operator.jpg

twitter:
  card: summary_large_image

# Posts inherit the post layout automatically
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/solar_operator.jpg
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Sumit Mahato

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - .gitignore
