<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {%- seo -%}
  {%- feed_meta -%}
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://calendar.google.com/calendar/scheduling-button-script.css" rel="stylesheet">
  <script src="https://calendar.google.com/calendar/scheduling-button-script.js" async></script>
  <style>

:root{
  --bg-primary:#fffaf7;--bg-secondary:#fff5f0;--bg-tertiary:#ffeee7;
  --border-color:#f0e0d5;--text-primary:#2a2a2a;--text-secondary:#666666;
  --text-tertiary:#999999;--accent:#d35d2a;--accent-dark:#b84a1f;--success:#10b981;
}
[data-theme="dark"]{
  --bg-primary:#0f0f0f;--bg-secondary:#161616;--bg-tertiary:#1a1a1a;
  --border-color:#222;--text-primary:#f5f5f5;--text-secondary:#999;
  --text-tertiary:#555;--accent:#f59e0b;--accent-dark:#d4a025;--success:#10b981;
}
*{box-sizing:border-box}html{font-size:16px;scroll-behavior:smooth;-webkit-font-smoothing:antialiased;transition:background-color 0.3s ease}
body{background:var(--bg-primary);color:var(--text-primary);font-family:'Sora',system-ui,sans-serif;line-height:1.6;overflow-x:hidden;margin:0;padding:0;transition:background-color 0.3s ease,color 0.3s ease}
nav{position:fixed;top:0;left:0;right:0;z-index:50;background:0;padding:18px 0;transition:all 300ms cubic-bezier(0.16,1,0.3,1)}
nav.scrolled{background:rgba(255,250,247,0.95);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border-bottom:1px solid rgba(211,93,42,0.15);padding:12px 0}
[data-theme="dark"] nav.scrolled{background:rgba(15,15,15,0.95);border-bottom:1px solid rgba(245,158,11,0.1)}
.nav-container{max-width:1280px;margin:0 auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between}
@media(max-width:768px){.nav-container{position:relative}.nav-logo{position:absolute;left:50%;transform:translateX(-50%)}#theme-toggle{margin-left:auto;order:2}#hamburger{order:3}}
.nav-logo{display:flex;align-items:center;gap:2px;text-decoration:none;font-size:28px;font-weight:700;color:var(--accent);font-family:'Crimson Text',serif;letter-spacing:-0.02em;transition:all 0.3s cubic-bezier(0.16,1,0.3,1);padding:6px 12px;border-radius:8px;margin-left:-12px}
.nav-logo:hover{transform:translateY(-2px);background:rgba(211,93,42,0.1)}
[data-theme="dark"] .nav-logo:hover{background:rgba(245,158,11,0.1)}
@media(max-width:768px){.nav-logo:hover{transform:translateX(-50%) translateY(0);background:rgba(211,93,42,0.1)}}
.nav-logo-sm{color:var(--text-secondary);font-weight:500;font-size:11px;font-family:'Sora',sans-serif;letter-spacing:0.08em;text-transform:uppercase;margin-left:2px}
.nav-links{display:flex;align-items:center;gap:28px;margin-left:auto}@media(max-width:768px){.nav-links{display:none}}
.nav-controls{display:flex;align-items:center;gap:12px}@media(max-width:768px){.nav-controls{gap:8px}}
.nav-link{font-size:13px;color:var(--text-tertiary);text-decoration:none;transition:all 150ms ease;padding-bottom:2px;border-bottom:2px solid transparent}
.nav-link:hover{color:var(--text-primary);border-bottom-color:var(--accent)}
.nav-status{font-size:11px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:6px}
.nav-status::before{content:'';width:6px;height:6px;background:var(--accent);border-radius:50%;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.nav-status:hover{opacity:0.8}
#theme-toggle{transition:all 0.3s cubic-bezier(0.16,1,0.3,1)!important;padding:8px 10px;border-radius:6px;border:1px solid rgba(211,93,42,0.3);color:var(--text-primary);display:flex;align-items:center;justify-content:center}
#theme-toggle:hover{transform:scale(1.1);color:var(--accent);border-color:var(--accent);background:rgba(211,93,42,0.08)}
#theme-toggle svg{color:inherit;transition:color 0.3s ease}
#sun-icon{color:#f59e0b}
#moon-icon{color:#d35d2a}
[data-theme="dark"] #theme-toggle{border-color:rgba(245,158,11,0.3)}
[data-theme="dark"] #theme-toggle:hover{border-color:var(--accent);background:rgba(245,158,11,0.08)}
[data-theme="dark"] #sun-icon{color:#f59e0b}
[data-theme="dark"] #moon-icon{color:#f59e0b}
#hamburger{display:none;background:0;border:0;color:var(--text-primary);cursor:pointer;padding:8px;font-size:20px}
@media(max-width:768px){#hamburger{display:block}}
#mobile-menu{display:none;position:absolute;top:60px;left:0;right:0;background:rgba(255,250,247,0.98);backdrop-filter:blur(32px);border-bottom:1px solid var(--border-color);flex-direction:column;gap:0;padding:16px 32px}
[data-theme="dark"] #mobile-menu{background:rgba(15,15,15,0.98)}
#mobile-menu.open{display:flex}
.mobile-link{color:var(--text-tertiary);text-decoration:none;padding:12px 0;font-size:13px;display:block;transition:color 150ms ease}
.mobile-link:hover{color:var(--text-primary);border-bottom-color:var(--accent)}
.hero{background:linear-gradient(135deg,rgba(255,250,247,0.98) 0%,rgba(255,245,240,0.95) 100%);padding:160px 32px 100px;text-align:center;position:relative;overflow:hidden}
[data-theme="dark"] .hero{background:linear-gradient(135deg,rgba(15,15,15,0.98) 0%,rgba(20,20,20,0.95) 100%)}
.dot-grid{background-image:radial-gradient(circle,rgba(211,93,42,0.05) 1px,transparent 1px);background-size:60px 60px;background-position:0 0}
.hero::before{content:'';position:absolute;top:-40%;right:-10%;width:600px;height:600px;background:radial-gradient(circle,rgba(211,93,42,0.08) 0%,transparent 75%);border-radius:50%;pointer-events:none;filter:blur(40px);animation:float 20s ease-in-out infinite}
.hero::after{content:'';position:absolute;bottom:-20%;left:-15%;width:500px;height:500px;background:radial-gradient(circle,rgba(211,93,42,0.05) 0%,transparent 75%);border-radius:50%;pointer-events:none;filter:blur(40px);animation:float-reverse 25s ease-in-out infinite}
[data-theme="dark"] .dot-grid{background-image:radial-gradient(circle,rgba(245,158,11,0.05) 1px,transparent 1px)}
[data-theme="dark"] .hero::before{background:radial-gradient(circle,rgba(245,158,11,0.08) 0%,transparent 75%)}
[data-theme="dark"] .hero::after{background:radial-gradient(circle,rgba(245,158,11,0.05) 0%,transparent 75%)}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-20px)}}
@keyframes float-reverse{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,20px)}}
.section-label{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:16px;display:block;font-family:'Sora',sans-serif}
h1{font-size:56px;font-weight:600;margin:0 0 24px;line-height:1.15;font-family:'Crimson Text',serif;letter-spacing:-0.02em}
h2{font-size:42px;font-weight:600;margin:0 0 32px;line-height:1.15;font-family:'Crimson Text',serif;letter-spacing:-0.02em}
h3{font-size:24px;font-weight:600;margin:0 0 16px;font-family:'Crimson Text',serif}
h4{font-size:16px;font-weight:600;margin:0 0 8px;font-family:'Crimson Text',serif}
.hero-subtitle{font-size:18px;color:var(--text-secondary);margin:0 0 12px;max-width:650px;margin-left:auto;margin-right:auto;font-weight:400}
.hero-meta{font-size:12px;color:var(--text-tertiary);margin:0 0 32px}
.section-subtitle{font-size:16px;color:var(--text-secondary);margin:0 0 32px;line-height:1.7;font-weight:400}
.proof-row{display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;margin-top:48px}
.proof-item{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.proof-number{font-size:32px;font-weight:700;color:var(--accent);font-family:'Crimson Text',serif;letter-spacing:-0.01em}
.proof-label{font-size:12px;color:var(--text-secondary)}
.stat-divider{width:1px;height:40px;background:rgba(211,93,42,0.2);margin:0 8px}
[data-theme="dark"] .stat-divider{background:rgba(245,158,11,0.2)}
section{position:relative;z-index:1;padding:80px 32px;max-width:1280px;margin:0 auto;contain:layout style paint}
@media(max-width:768px){section{padding:48px 20px}}
section.full-width{max-width:100%;padding:80px 32px}
.reveal{opacity:0;transform:translateY(20px);transition:opacity 0.6s cubic-bezier(0.16,1,0.3,1),transform 0.6s cubic-bezier(0.16,1,0.3,1);will-change:opacity,transform;visibility:hidden}
.reveal.visible{opacity:1;transform:translateY(0);transition-duration:0.6s;visibility:visible}
.timeline{display:flex;flex-direction:column;gap:32px;margin:0}
.timeline-item{display:flex;gap:24px;position:relative}
.timeline-item::before{content:'';position:absolute;left:7px;top:40px;width:1px;height:calc(100% + 32px);background:linear-gradient(to bottom,var(--accent),transparent);z-index:0}
.timeline-item:last-child::before{display:none}
.timeline-dot{width:16px;height:16px;background:var(--accent);border-radius:50%;margin-top:4px;flex-shrink:0;z-index:1;box-shadow:0 0 12px rgba(211,93,42,0.4)}
[data-theme="dark"] .timeline-dot{box-shadow:0 0 12px rgba(245,158,11,0.4)}
.timeline-content{flex:1;padding:0 0 0 0}
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:28px;margin:0}
.card{background:linear-gradient(135deg,rgba(255,252,249,0.95) 0%,rgba(255,248,244,0.85) 100%);border:1px solid var(--border-color);border-radius:6px;padding:32px;transition:all 0.3s cubic-bezier(0.16,1,0.3,1);will-change:border-color,background-color;backdrop-filter:blur(8px)}
.card:hover{border-color:var(--accent);background:linear-gradient(135deg,rgba(211,93,42,0.06) 0%,rgba(211,93,42,0.03) 100%);transform:translateY(-4px);box-shadow:0 12px 32px rgba(211,93,42,0.12)}
[data-theme="dark"] .card{background:linear-gradient(135deg,rgba(30,30,30,0.8) 0%,rgba(25,25,25,0.6) 100%)}
[data-theme="dark"] .card:hover{background:linear-gradient(135deg,rgba(245,158,11,0.08) 0%,rgba(245,158,11,0.04) 100%);box-shadow:0 12px 32px rgba(245,158,11,0.12)}
p{margin:0 0 16px;font-size:14px;line-height:1.7}
.card-badge{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:12px;display:block}
.card h3{margin-bottom:12px}
.card p:last-child{margin-bottom:0}
.comparison-card{background:linear-gradient(135deg,rgba(211,93,42,0.08) 0%,rgba(211,93,42,0.04) 100%)}
[data-theme="dark"] .comparison-card{background:linear-gradient(135deg,rgba(245,158,11,0.08) 0%,rgba(245,158,11,0.04) 100%)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 32px;border-radius:4px;text-decoration:none;font-size:12px;font-weight:600;border:1px solid transparent;transition:all 0.3s cubic-bezier(0.16,1,0.3,1);cursor:pointer;text-transform:uppercase;letter-spacing:0.06em;font-family:'Sora',sans-serif}
.btn-primary{background:var(--accent);color:var(--bg-primary);will-change:background,transform,box-shadow;position:relative;overflow:hidden;font-weight:700}
.btn-primary::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:var(--accent-dark);transition:left 0.3s cubic-bezier(0.16,1,0.3,1);z-index:-1}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(211,93,42,0.3)}.btn-primary:hover::before{left:0}
[data-theme="dark"] .btn-primary:hover{box-shadow:0 12px 40px rgba(245,158,11,0.3)}
.btn-secondary{background:transparent;color:var(--accent);border-color:var(--accent);position:relative}
.btn-secondary::after{content:'';position:absolute;bottom:0;left:0;width:0;height:2px;background:var(--accent);transition:width 0.3s cubic-bezier(0.16,1,0.3,1)}
.btn-secondary:hover::after{width:100%}
.form-group{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
label{font-size:12px;font-weight:600;color:var(--text-primary);text-transform:uppercase;letter-spacing:0.05em}
input,textarea,select{background:rgba(255,252,249,0.85);border:1px solid var(--border-color);color:var(--text-primary);padding:12px 16px;border-radius:6px;font-family:inherit;font-size:14px;transition:all 0.3s ease;backdrop-filter:blur(4px)}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--accent);background:rgba(211,93,42,0.05);box-shadow:0 0 0 3px rgba(211,93,42,0.1)}
[data-theme="dark"] input,[data-theme="dark"] textarea,[data-theme="dark"] select{background:rgba(30,30,30,0.7);border-color:var(--border-color)}
[data-theme="dark"] input:focus,[data-theme="dark"] textarea:focus,[data-theme="dark"] select:focus{background:rgba(245,158,11,0.08);border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,158,11,0.1)}
textarea{resize:vertical;min-height:120px}
footer{border-top:1px solid var(--border-color);background:var(--bg-secondary);padding:48px 32px 24px;margin-top:80px}
.container{max-width:1280px;margin:0 auto;padding:0}
.footer-section{margin-bottom:32px}
footer h4{font-size:12px;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:16px;color:var(--text-primary);font-family:'Sora',sans-serif}
footer ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
footer a{color:var(--text-secondary);text-decoration:none;font-size:13px;transition:color 0.3s ease}
footer a:hover{color:var(--accent)}
.footer-bottom{display:flex;justify-content:space-between;align-items:center;padding-top:24px;border-top:1px solid var(--border-color);gap:24px}
.footer-copyright{font-size:12px;color:var(--text-tertiary);margin:0}
.footer-social{display:flex;gap:16px}
footer .container{display:grid;grid-template-columns:repeat(3,1fr);gap:48px;margin-bottom:48px}
@media(max-width:768px){footer .container{grid-template-columns:1fr}.footer-bottom{flex-direction:column;align-items:flex-start}h1{font-size:36px}h2{font-size:28px}h3{font-size:20px}.proof-row{gap:8px}.proof-number{font-size:24px}.proof-label{font-size:11px}.timeline-item{gap:16px}.card-grid{grid-template-columns:1fr}}
  
/* ---- BLOG ---- */
.post-content,.post-header{max-width:760px;margin-left:auto;margin-right:auto}
.post-header{margin-bottom:48px;text-align:center}
.post-meta{font-size:13px;color:var(--text-tertiary);margin:0}
.post-back{display:inline-block;margin-bottom:8px;font-size:13px;color:var(--accent);text-decoration:none}
.post-back:hover{text-decoration:underline}
.post-content p{font-size:17px;line-height:1.8;margin:0 0 24px;color:var(--text-secondary)}
.post-content h2{font-size:30px;margin:48px 0 20px}
.post-content h3{font-size:22px;margin:36px 0 14px}
.post-content ul,.post-content ol{font-size:17px;line-height:1.8;color:var(--text-secondary);padding-left:24px;margin:0 0 24px}
.post-content li{margin-bottom:8px}
.post-content a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.post-content strong{color:var(--text-primary)}
.post-content blockquote{border-left:3px solid var(--accent);margin:32px 0;padding:12px 24px;font-style:italic;color:var(--text-secondary);background:var(--bg-secondary);border-radius:0 6px 6px 0}
.post-content blockquote p:last-child{margin-bottom:0}
.post-content img{max-width:100%;height:auto;border-radius:6px;margin:32px 0}
.post-content code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:0.9em;background:var(--bg-tertiary);padding:2px 6px;border-radius:4px}
.post-content pre{background:var(--bg-tertiary);border:1px solid var(--border-color);border-radius:6px;padding:20px;overflow-x:auto;margin:0 0 24px}
.post-content pre code{background:0;padding:0}
.post-content hr{border:0;border-top:1px solid var(--border-color);margin:40px 0}
.blog-card h3{margin-bottom:12px}
.blog-card time{font-size:12px}
.post-content .footnotes{margin-top:56px;padding-top:24px;border-top:1px solid var(--border-color);font-size:14px}
.post-content .footnotes ol{padding-left:20px}
.post-content .footnotes li{margin-bottom:8px;color:var(--text-tertiary);line-height:1.6}
.post-content .footnotes li p{font-size:14px;margin:0}
.post-content sup a.footnote{text-decoration:none;font-weight:700;padding:0 1px}
.post-content figure{margin:0 0 36px}
.post-content figure img{margin:0 0 10px;width:100%}
.post-content figcaption{font-size:13px;color:var(--text-tertiary);text-align:center;font-style:italic;line-height:1.5}
  </style>
</head>
<body>

{% include nav.html %}

{{ content }}

{% include footer.html %}

{% include scripts.html %}

</body>
</html>
